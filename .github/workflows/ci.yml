name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: 数据校验（id 唯一 / 引用完整 / 字段范围）
        run: npm run lint:data
      - name: 构建
        run: npm run build

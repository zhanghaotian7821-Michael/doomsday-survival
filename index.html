<!DOCTYPE html>
<html lang="zh-CN" data-theme="wasteland">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>末日准备者 - 综合生存知识库</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/wasteland.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-bar">
        <button class="menu-toggle" id="menuToggle" title="菜单">☰</button>
        <div class="logo">
            <span class="logo-icon">☢️</span>
            <span class="logo-text">末日准备者</span>
            <span class="logo-sub">SURVIVAL KNOWLEDGE BASE</span>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="搜索生存知识... (按 / 快速聚焦)" autocomplete="off">
            <button class="search-btn" id="searchBtn">🔍</button>
            <div class="search-results" id="searchResults"></div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="advisorBtn" title="智能推荐">🧠 智能推荐</button>
            <button class="icon-btn" id="resourcesBtn" title="物资资料库">📦 物资库</button>
            <button class="icon-btn" id="plannerBtn" title="避难所规划器">🏗️ 规划器</button>
            <button class="icon-btn" id="favBtn" title="收藏夹">⭐ <span class="badge" id="favCount">0</span></button>
            <button class="icon-btn" id="calcBtn" title="生存计算器">🧮</button>
            <button class="icon-btn" id="themeBtn" title="切换配色">⬤</button>
            <button class="icon-btn" id="printBtn" title="打印当前内容">🖨️</button>
        </div>
    </header>

    <!-- 主体布局 -->
    <div class="main-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>📋 知识分类</h2>
                <button class="collapse-all" id="collapseAll">全部折叠</button>
            </div>
            <nav class="nav-tree" id="navTree">
                <!-- 由JS动态生成 -->
            </nav>
            <div class="sidebar-footer">
                <button class="btn-secondary" id="showFavorites">⭐ 查看收藏夹</button>
                <button class="btn-secondary" id="showChecklist">📝 生存清单</button>
            </div>
        </aside>

        <!-- 遮罩层 (移动端) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 主内容区 -->
        <main class="content" id="mainContent">
            <!-- 欢迎页面 -->
            <div class="welcome" id="welcomePage">
                <div class="welcome-hero">
                    <!-- 废墟天际线主视觉（纯 SVG，无图片资源） -->
                    <div class="hero-scene" aria-hidden="true">
                        <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <radialGradient id="hsSun" cx="0.5" cy="0.5" r="0.5">
                                    <stop offset="0" stop-color="#ffd27a" stop-opacity="0.5"/>
                                    <stop offset="0.45" stop-color="#ffb02e" stop-opacity="0.16"/>
                                    <stop offset="1" stop-color="#ffb02e" stop-opacity="0"/>
                                </radialGradient>
                                <linearGradient id="hsHaze" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#0e0a07" stop-opacity="0"/>
                                    <stop offset="0.62" stop-color="#0e0a07" stop-opacity="0.55"/>
                                    <stop offset="1" stop-color="#0e0a07" stop-opacity="1"/>
                                </linearGradient>
                                <linearGradient id="hsFar" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#33261a"/>
                                    <stop offset="1" stop-color="#241a12"/>
                                </linearGradient>
                            </defs>
                            <circle cx="880" cy="118" r="196" fill="url(#hsSun)"/><circle cx="880" cy="118" r="86" fill="url(#hsSun)" opacity="0.75"/>
                            <g fill="url(#hsFar)" opacity="0.85">
                                <path d="M0 300V238h56v-18h38v18h52v-26h54v26h66v-12h48v12h58v-22h52v22h76v-10h58v10h66v-18h58v18h68v-7h66v7h86v-16h58v16h68z"/>
                            </g>
                            <g fill="#1d150e">
                                <path d="M118 300V212l26-11v-21l24 12v-26l22 11v123z"/>
                                <path d="M404 300V228l22-17v-14l20 9v-23l18 8v109z"/>
                                <path d="M742 300V196l24 14v-26l22 18v-17l18 11v104z"/>
                                <path d="M1012 300V220l20-12v-18l18 10v100z"/>
                            </g>
                            <g stroke="#0d0906" fill="none">
                                <path d="M0 252h216l54 14" stroke-width="10"/>
                                <path d="M330 266h74" stroke-width="10"/>
                                <path d="M436 250h186" stroke-width="10"/>
                                <path d="M676 262l52-16h176" stroke-width="10"/>
                                <path d="M948 246h252" stroke-width="9" opacity="0.8"/>
                            </g>
                            <g fill="#171008" opacity="0.95">
                                <rect x="150" y="252" width="16" height="48"/>
                                <rect x="520" y="250" width="16" height="50"/>
                                <rect x="820" y="226" width="14" height="74"/>
                            </g>
                            <g fill="#0c0806">
                                <path d="M60 300l22-26 30 12 18-16 20 30z"/>
                                <path d="M300 300l18-18 26 8 14 10z"/>
                                <path d="M980 300l20-22 28 10 16 12z"/>
                                <path d="M1120 300l16-18 24 8 14 10z"/>
                            </g>
                            <rect y="170" width="1200" height="130" fill="url(#hsHaze)"/>
                        </svg>
                    </div>
                    <h1>☢️ 末日准备者综合生存知识库</h1>
                    <p class="welcome-subtitle">BE PREPARED. STAY ALIVE.</p>
                    <div class="welcome-stats">
                        <div class="stat-item">
                            <span class="stat-num" id="statCategories">17</span>
                            <span class="stat-label">知识分类</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-num" id="statArticles">200+</span>
                            <span class="stat-label">生存指南</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-num" id="statTools">4</span>
                            <span class="stat-label">计算工具</span>
                        </div>
                    </div>
                </div>
                <div class="welcome-grid" id="welcomeGrid">
                    <!-- 由JS动态生成分类卡片 -->
                </div>
                <div class="welcome-quote">
                    <blockquote>"准备不是恐惧，而是对生命的尊重。当灾难来临时，准备者不是惊慌失措的受害者，而是能够保护自己和家人的守护者。"</blockquote>
                </div>
            </div>

            <!-- 内容详情页 -->
            <div class="article-page" id="articlePage" style="display:none;">
                <div class="breadcrumb" id="breadcrumb"></div>
                <article class="article-content" id="articleContent"></article>
                <div class="article-meta" id="articleMeta"></div>
                <div class="article-related" id="articleRelated"></div>
            </div>

            <!-- 收藏夹页面 -->
            <div class="favorites-page" id="favoritesPage" style="display:none;">
                <h2>⭐ 我的收藏夹</h2>
                <div id="favoritesList"></div>
            </div>

            <!-- 生存清单页面 -->
            <div class="checklist-page" id="checklistPage" style="display:none;">
                <h2>📝 生存物资清单</h2>
                <div id="checklistContent"></div>
            </div>

            <!-- 物资资料库 -->
            <div class="resources-page" id="resourcesPage" style="display:none;">
                <div id="resourcesContent"></div>
            </div>

            <!-- 避难所规划器 -->
            <div class="planner-page" id="plannerPage" style="display:none;">
                <div id="plannerContent"></div>
            </div>

            <!-- 智能推荐 -->
            <div class="advisor-page" id="advisorPage" style="display:none;">
                <div id="advisorContent"></div>
            </div>

            <!-- 物资详情模态 -->
            <div class="modal-overlay" id="resourceModal">
                <div class="modal modal-wide">
                    <div class="modal-header">
                        <h2 id="resourceModalTitle">物资详情</h2>
                        <button class="modal-close" id="resourceModalClose">✕</button>
                    </div>
                    <div class="modal-body" id="resourceModalBody"></div>
                </div>
            </div>

            <!-- 物资对比面板 -->
            <div class="compare-panel" id="comparePanel" style="display:none;">
                <div class="compare-header">
                    <span>🔄 对比模式 (<span id="compareCount">0</span>/4)</span>
                    <button class="btn-action" id="compareClear">清空</button>
                    <button class="btn-action" id="compareToggle">收起</button>
                </div>
                <div class="compare-items" id="compareItems"></div>
            </div>
        </main>
    </div>

    <!-- 计算器模态框 -->
    <div class="modal-overlay" id="calcModal">
        <div class="modal">
            <div class="modal-header">
                <h2>🧮 生存计算器</h2>
                <button class="modal-close" id="calcClose">✕</button>
            </div>
            <div class="modal-body" id="calcBody">
                <!-- 由JS动态生成 -->
            </div>
        </div>
    </div>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop" title="回到顶部">⬆</button>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
